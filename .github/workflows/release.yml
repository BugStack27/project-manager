name: Release

# 推 v 前缀 tag 触发：v2.0.1 → 构建 Windows 安装包并把 exe / blockmap / latest.yml
# 挂到同名 GitHub Release。客户端 electron-updater（electron/services/updater.js）
# 靠这份 latest.yml 判断「有新版本」，没有 release 资产它就永远停在 up-to-date。
on:
  push:
    tags:
      - 'v*'

# electron-builder 需要写 Release 的权限；GITHUB_TOKEN 够用，不必配个人 PAT
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node 22：Vite 8 要求 ≥20.19 / ≥22.12，20.x 早期的镜像会直接报 engine 不匹配
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # latest.yml 里的版本来自 package.json，tag 对不上就会发出一个装不上的更新
      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 安装主进程依赖
        run: npm ci

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      # 语法自检先跑一遍：坏文件到打包阶段才炸，发布 tag 已经推出去了，回滚更麻烦
      - name: 语法自检
        run: npm run check

      - name: 构建前端
        run: npm run build

      # cloudflared 随安装包内置（resources/cloudflared），首次使用手机端通信不必赌 GitHub 直连
      - name: 准备内置 cloudflared
        run: npm run prep:cloudflared

      # electron-builder 自带的发布器有竞态：exe / blockmap / latest.yml 并发上传时，
      # 每个上传任务各起一个发布器，各自「查不到就建」，于是同一个 tag 建出两三个
      # Release，资产还被拆散——latest.yml 落进没人下载的那份里，客户端就 404。
      # 因此这里不用 --publish：只让 electron-builder 打包，Release 交给 gh 建与传。
      - name: 打包
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 建 Release 并上传资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          ls -l release

          # 正文取自 annotated tag；轻量 tag 没有注释，退回空正文
          BODY="$(git tag -l --format='%(contents)' "$TAG")"

          # 必须用带 token 的列表：/releases/tags/:tag 查不到草稿，而我们的历史 Release
          # 很可能已经是草稿——之前反复删 / 重推同名 tag，已发布的 Release 会被摘成
          # untagged 草稿（html_url 变成 /releases/tag/untagged-xxxx），页面上看不见，
          # /releases/download/<tag>/latest.yml 就 404。
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                 --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)

          if [ -z "$ID" ]; then
            echo "没有现存 Release，新建 $TAG"
            # make_latest 是字符串枚举（true/false/legacy），必须用 -f 原样传字符，
            # 用 -F 会被解析成布尔 true，GitHub 返回 422 "true is not a string"
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f name="$VER" -f body="$BODY" \
                   -F draft=false -f make_latest=true --jq .id)
          else
            echo "复用 Release $ID，重新绑定 tag 并确保处于已发布状态"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f tag_name="$TAG" -f name="$VER" -f body="$BODY" \
              -F draft=false -f make_latest=true >/dev/null
          fi

          # --clobber：重发同一版本时覆盖同名旧资产，不会卡在 422
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --clobber

          # 客户端只认 latest.yml，缺了必然 404，宁可这里失败也别发个装不上的版本
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft)
          rtag=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .tag_name)
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '[.assets[].name]|join(",")')
          echo "release $ID: draft=$draft tag=$rtag assets=$assets"

          [ "$draft" = "false" ] || { echo "::error::Release 仍是草稿，下载地址不会生效"; exit 1; }
          [ "$rtag" = "$TAG" ]   || { echo "::error::Release 绑定的 tag 是 $rtag，不是 $TAG"; exit 1; }
          case "$assets" in *latest.yml*) ;; *) echo "::error::Release 缺少 latest.yml"; exit 1 ;; esac
          case "$assets" in *.exe*)       ;; *) echo "::error::Release 缺少安装包 exe"; exit 1 ;; esac

      # 收尾：同一个 tag 只留上面那个 Release，历史遗留的草稿 / 重复一并删掉
      # （它们的资产是旧的，留着只会让 Release 页和 latest.yml 指向错的地方）
      - name: 清理同名重复 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                  --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          keep=$(echo "$ids" | head -n1)
          echo "$ids" | tail -n +2 | while read -r id; do
            [ -z "$id" ] && continue
            echo "删除重复 Release $id（保留 $keep）"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
