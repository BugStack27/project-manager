name: Release

# 推 v 前缀 tag 触发：v2.0.1 → 构建 Windows 安装包并把 exe / blockmap / latest.yml
# 挂到同名 GitHub Release。客户端 electron-updater（electron/services/updater.js）
# 靠这份 latest.yml 判断「有新版本」，没有 release 资产它就永远停在 up-to-date。
on:
  push:
    tags:
      - 'v*'

# electron-builder 需要写 Release 的权限；GITHUB_TOKEN 够用，不必配个人 PAT
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node 22：Vite 8 要求 ≥20.19 / ≥22.12，20.x 早期的镜像会直接报 engine 不匹配
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # latest.yml 里的版本来自 package.json，tag 对不上就会发出一个装不上的更新
      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 安装主进程依赖
        run: npm ci

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      # 语法自检先跑一遍：坏文件到打包阶段才炸，发布 tag 已经推出去了，回滚更麻烦
      - name: 语法自检
        run: npm run check

      - name: 构建前端
        run: npm run build

      # electron-builder 自带的发布器有竞态：exe / blockmap / latest.yml 并发上传时，
      # 每个上传任务各起一个发布器，各自「查不到就建」，于是同一个 tag 建出两三个
      # Release，资产还被拆散——latest.yml 落进没人下载的那份里，客户端就 404。
      # 因此这里不用 --publish：只让 electron-builder 打包，Release 交给 gh 建与传。
      - name: 打包
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 建 Release 并上传资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ls -l release

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # 正文取自 annotated tag；轻量 tag 没有注释，退回空正文
            if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
              gh release create "$TAG" --title "${TAG#v}" --verify-tag --latest --notes-from-tag
            else
              echo "::notice::$TAG 不是 annotated tag，Release 正文留空"
              gh release create "$TAG" --title "${TAG#v}" --verify-tag --latest --notes ""
            fi
          else
            echo "Release $TAG 已存在，只补传资产"
          fi

          # --clobber：重发同一版本时覆盖同名旧资产，不会卡在 422
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap release/latest.yml --clobber

          # 客户端只认 latest.yml，缺了必然 404，宁可这里失败也别发个装不上的版本
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -qx "latest.yml" || { echo "::error::Release 缺少 latest.yml"; exit 1; }
          echo "$assets" | grep -q '\.exe$'      || { echo "::error::Release 缺少安装包 exe"; exit 1; }

      # 收尾去重：只删一个资产都没有的空壳 Release，带资产的一律不自动删
      - name: 清理空壳 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | select((.assets|length)==0) | .id" |
          while read -r id; do
            [ -z "$id" ] && continue
            echo "删除空壳 Release $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
